name: Process Audio (YouTube/TikTok/SoundCloud/Upload)

on:
  workflow_dispatch:
    inputs:
      source_type:
        description: 'Source type (youtube/tiktok/soundcloud/mp3)'
        required: true
        type: choice
        options:
          - youtube
          - tiktok
          - soundcloud
          - mp3
      url:
        description: 'URL (untuk YouTube/TikTok/SoundCloud)'
        required: false
        type: string
      mp3_file_url:
        description: 'Direct file URL (untuk source_type=mp3, support *.mp3/ogg/wav/flac)'
        required: false
        type: string
      input_format:
        description: 'Format file input upload (mp3/ogg/wav/flac) — hanya berlaku jika source_type=mp3'
        required: false
        default: 'mp3'
        type: choice
        options:
          - mp3
          - ogg
          - wav
          - flac
      file_title:
        description: 'Judul file audio yang diupload'
        required: false
        default: 'uploaded_audio'
        type: string
      cookies:
        description: 'YouTube cookies (format Netscape) — opsional'
        required: false
        type: string
      speed:
        description: 'Kecepatan tempo manual (0.5–5.0) — dipakai jika auto_speed=false'
        required: false
        default: '2.3'
        type: string
      amplify:
        description: 'Gain tambahan dalam dB setelah loudnorm (-20 sampai 20)'
        required: false
        default: '0'
        type: string
      max_duration:
        description: 'Durasi maksimum per bagian (detik) — default 400 (batas Roblox)'
        required: false
        default: '400'
        type: string
      auto_speed:
        description: 'Hitung speed otomatis: durasi/max_duration jika durasi > max (true/false)'
        required: false
        default: 'true'
        type: string
      normalize_db:
        description: 'Target true peak loudnorm dalam dB (mis. -1 atau -2)'
        required: false
        default: '-1'
        type: string
      use_loudnorm:
        description: 'Gunakan loudnorm untuk normalisasi dinamis (true/false)'
        required: false
        default: 'true'
        type: string
      output_format:
        description: 'Format output (mp3/ogg/flac/wav)'
        required: false
        default: 'ogg'
        type: choice
        options:
          - ogg
          - mp3
          - flac
          - wav
      auto_cut:
        description: 'Potong otomatis jika durasi melebihi max_duration (true/false)'
        required: false
        default: 'true'
        type: string
      job_id:
        description: 'Job ID dari web (wajib diisi)'
        required: true
        type: string
      callback_url:
        description: 'Webhook callback URL (wajib diisi)'
        required: true
        type: string

jobs:
  process-audio:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ================================================================
      # SETUP FFmpeg & RUBBERBAND
      # ================================================================
      - name: Setup FFmpeg and Rubberband
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg rubberband-cli librubberband-dev bc jq
          ffmpeg -version | head -1
          rubberband --version 2>/dev/null || echo "rubberband installed"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-yt-dlp
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install yt-dlp
        run: |
          pip install yt-dlp

      - name: Create temp directory
        run: mkdir -p temp

      # ===================================================================
      # DOWNLOAD — YouTube
      # ===================================================================
      - name: Download from YouTube
        if: inputs.source_type == 'youtube'
        id: download_youtube
        run: |
          cd temp
          echo "▶️ Downloading from YouTube: ${{ inputs.url }}"

          if [ -n "${{ inputs.cookies }}" ]; then
            echo "${{ inputs.cookies }}" > cookies.txt
            COOKIES_OPT="--cookies cookies.txt"
          else
            COOKIES_OPT=""
          fi

          yt-dlp $COOKIES_OPT \
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            --skip-download \
            --print-json \
            "${{ inputs.url }}" > info.json || {
              echo "❌ Gagal mengambil metadata YouTube"
              exit 1
            }

          TITLE=$(jq -r '.title' info.json)
          DURATION=$(jq -r '.duration' info.json)

          yt-dlp $COOKIES_OPT \
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            --extract-audio \
            --audio-format mp3 \
            --audio-quality 0 \
            --output "audio.%(ext)s" \
            "${{ inputs.url }}" || {
              echo "❌ Gagal download audio YouTube"
              exit 1
            }

          FILENAME="audio.mp3"
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT
          echo "title=$TITLE"       >> $GITHUB_OUTPUT
          echo "duration=$DURATION" >> $GITHUB_OUTPUT
          cd ..

      # ===================================================================
      # DOWNLOAD — TikTok
      # ===================================================================
      - name: Download from TikTok
        if: inputs.source_type == 'tiktok'
        id: download_tiktok
        run: |
          cd temp
          echo "▶️ Downloading from TikTok: ${{ inputs.url }}"

          yt-dlp \
            --user-agent "Mozilla/5.0" \
            --skip-download \
            --print-json \
            "${{ inputs.url }}" > info.json || {
              echo "❌ Gagal mengambil metadata TikTok"
              exit 1
            }

          TITLE=$(jq -r '.title' info.json)
          DURATION=$(jq -r '.duration' info.json)

          yt-dlp \
            --user-agent "Mozilla/5.0" \
            --extract-audio \
            --audio-format mp3 \
            --audio-quality 0 \
            --output "audio.%(ext)s" \
            "${{ inputs.url }}" || {
              echo "❌ Gagal download audio TikTok"
              exit 1
            }

          FILENAME="audio.mp3"
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT
          echo "title=$TITLE"       >> $GITHUB_OUTPUT
          echo "duration=$DURATION" >> $GITHUB_OUTPUT
          cd ..

      # ===================================================================
      # DOWNLOAD — SoundCloud
      # ===================================================================
      - name: Download from SoundCloud
        if: inputs.source_type == 'soundcloud'
        id: download_soundcloud
        run: |
          cd temp
          echo "▶️ Downloading from SoundCloud: ${{ inputs.url }}"

          yt-dlp \
            --user-agent "Mozilla/5.0" \
            --skip-download \
            --print-json \
            "${{ inputs.url }}" > info.json || {
              echo "❌ Gagal mengambil metadata SoundCloud"
              exit 1
            }

          TITLE=$(jq -r '.title' info.json)
          DURATION=$(jq -r '.duration' info.json)

          yt-dlp \
            --user-agent "Mozilla/5.0" \
            --extract-audio \
            --audio-format mp3 \
            --audio-quality 0 \
            --output "audio.%(ext)s" \
            "${{ inputs.url }}" || {
              echo "❌ Gagal download audio SoundCloud"
              exit 1
            }

          FILENAME="audio.mp3"
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT
          echo "title=$TITLE"       >> $GITHUB_OUTPUT
          echo "duration=$DURATION" >> $GITHUB_OUTPUT
          cd ..

      # ===================================================================
      # DOWNLOAD — Direct Upload
      # ===================================================================
      - name: Download audio from direct URL
        if: inputs.source_type == 'mp3'
        id: download_mp3
        run: |
          cd temp
          INPUT_FORMAT="${{ inputs.input_format }}"
          INPUT_FILE="input.${INPUT_FORMAT}"
          echo "⬇️ Downloading audio (${INPUT_FORMAT}): ${{ inputs.mp3_file_url }}"

          HTTP_STATUS=$(curl -L \
            --retry 3 \
            --max-time 300 \
            -w "%{http_code}" \
            -o "$INPUT_FILE" \
            "${{ inputs.mp3_file_url }}")

          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ Download gagal dengan HTTP status $HTTP_STATUS"
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "$INPUT_FILE")
          echo "Ukuran file: $FILE_SIZE bytes"
          file "$INPUT_FILE"

          if ! ffprobe -v error -i "$INPUT_FILE" 2>/dev/null; then
            echo "❌ File bukan audio yang valid"
            exit 1
          fi

          DURATION=$(ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            "$INPUT_FILE" 2>/dev/null || echo "0")

          echo "Durasi: $DURATION detik"
          echo "filename=$INPUT_FILE"             >> $GITHUB_OUTPUT
          echo "title=${{ inputs.file_title }}"   >> $GITHUB_OUTPUT
          echo "duration=$DURATION"               >> $GITHUB_OUTPUT
          cd ..

      # ===================================================================
      # PROCESS AUDIO — Rubberband R3 Engine (Kualitas Maksimal)
      # ===================================================================
      - name: Process Audio with Rubberband
        id: process
        run: |
          cd temp

          case "${{ inputs.source_type }}" in
            youtube)    INPUT_FILE="${{ steps.download_youtube.outputs.filename }}"; TITLE="${{ steps.download_youtube.outputs.title }}"; TOTAL_DURATION="${{ steps.download_youtube.outputs.duration }}" ;;
            tiktok)     INPUT_FILE="${{ steps.download_tiktok.outputs.filename }}"; TITLE="${{ steps.download_tiktok.outputs.title }}"; TOTAL_DURATION="${{ steps.download_tiktok.outputs.duration }}" ;;
            soundcloud) INPUT_FILE="${{ steps.download_soundcloud.outputs.filename }}"; TITLE="${{ steps.download_soundcloud.outputs.title }}"; TOTAL_DURATION="${{ steps.download_soundcloud.outputs.duration }}" ;;
            mp3)        INPUT_FILE="${{ steps.download_mp3.outputs.filename }}"; TITLE="${{ steps.download_mp3.outputs.title }}"; TOTAL_DURATION="${{ steps.download_mp3.outputs.duration }}" ;;
          esac

          echo "📂 Input  : $INPUT_FILE"
          echo "🎵 Title  : $TITLE"
          echo "⏱ Durasi asli: ${TOTAL_DURATION}s"

          if [ ! -f "$INPUT_FILE" ]; then
            echo "❌ Input file tidak ditemukan: $INPUT_FILE"
            exit 1
          fi

          OUTPUT_FORMAT="${{ inputs.output_format }}"
          MAX_DURATION="${{ inputs.max_duration }}"
          AUTO_CUT="${{ inputs.auto_cut }}"
          AUTO_SPEED="${{ inputs.auto_speed }}"
          MANUAL_SPEED="${{ inputs.speed }}"
          AMPLIFY="${{ inputs.amplify }}"
          NORMALIZE_DB="${{ inputs.normalize_db }}"
          USE_LOUDNORM="${{ inputs.use_loudnorm }}"
          SAMPLE_RATE=48000

          case "$OUTPUT_FORMAT" in
            mp3)  OUT_CODEC="-c:a libmp3lame -b:a 320k" ; EXT="mp3"  ; FORMAT="mp3"  ;;
            flac) OUT_CODEC="-c:a flac"                  ; EXT="flac" ; FORMAT="flac" ;;
            wav)  OUT_CODEC="-c:a pcm_s16le"             ; EXT="wav"  ; FORMAT="wav"  ;;
            ogg|*) OUT_CODEC="-c:a libvorbis -q:a 10"    ; EXT="ogg"  ; FORMAT="ogg"  ;;
          esac

          echo "🎚 Output: $OUTPUT_FORMAT @ ${SAMPLE_RATE}Hz stereo"

          # ── Step 1: Decode ke WAV lossless ──
          MASTER_WAV="master_${{ inputs.job_id }}.wav"
          ffmpeg -y -i "$INPUT_FILE" \
            -ar $SAMPLE_RATE -ac 2 \
            -c:a pcm_s16le \
            -af "aresample=resampler=soxr:precision=28:cheby=1" \
            -loglevel error \
            "$MASTER_WAV" 2>> ffmpeg-error.log || {
              echo "❌ Gagal decode ke WAV"
              cat ffmpeg-error.log
              exit 1
            }

          # Ambil durasi aktual dari WAV
          TOTAL_DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$MASTER_WAV")
          echo "⏱ Durasi setelah decode: ${TOTAL_DURATION}s"

          # ── Step 2: Hitung speed factor ──
          if [ "$AUTO_SPEED" == "true" ]; then
            if (( $(echo "$TOTAL_DURATION > $MAX_DURATION" | bc -l) )); then
              SPEED=$(echo "scale=6; $TOTAL_DURATION / $MAX_DURATION" | bc -l)
              echo "⚡ Auto speed: ${SPEED}x (fit ke ${MAX_DURATION}s)"
            else
              SPEED="$MANUAL_SPEED"
              echo "⚡ Durasi <= ${MAX_DURATION}s, pakai speed manual: ${SPEED}x"
            fi
          else
            SPEED="$MANUAL_SPEED"
            echo "⚡ Speed manual: ${SPEED}x"
          fi

          # ── Step 3: Rubberband Time Stretch (R3 Engine - Kualitas Tertinggi) ──
          STRETCHED_WAV="stretched_${{ inputs.job_id }}.wav"
          
          echo "🔄 Rubberband time-stretch: ${SPEED}x (R3 engine - kualitas tertinggi)"
          echo "   Parameter: -3 (R3 engine) --pitch 0 -c 5 (crispness)"
          
          rubberband -3 -t "$SPEED" \
            --pitch 0 \
            -c 5 \
            "$MASTER_WAV" "$STRETCHED_WAV" 2>> rubberband-error.log || {
              echo "❌ Rubberband gagal"
              cat rubberband-error.log
              exit 1
            }

          ADJUSTED_DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$STRETCHED_WAV")
          echo "📏 Durasi setelah time stretch: ${ADJUSTED_DURATION}s"
          echo "applied_speed=$SPEED" >> $GITHUB_OUTPUT

          # ── Step 4: Bangun filter chain untuk loudnorm + amplify + compressor ──
          FILTER_CHAIN=""

          if [ "$USE_LOUDNORM" == "true" ]; then
            TP=$(echo "$NORMALIZE_DB" | tr -d '-')
            FILTER_CHAIN="loudnorm=I=-16:LRA=11:TP=-${TP}:linear=true"
          fi

          if [ "$AMPLIFY" != "0" ] && [ -n "$AMPLIFY" ]; then
            if [ -n "$FILTER_CHAIN" ]; then
              FILTER_CHAIN="${FILTER_CHAIN},volume=${AMPLIFY}dB"
            else
              FILTER_CHAIN="volume=${AMPLIFY}dB"
            fi
          fi

          if [ -n "$FILTER_CHAIN" ]; then
            FILTER_CHAIN="${FILTER_CHAIN},acompressor=threshold=-18dB:ratio=3:attack=5:release=50"
          else
            FILTER_CHAIN="acompressor=threshold=-18dB:ratio=3:attack=5:release=50"
          fi

          echo "🔗 Filter chain: ${FILTER_CHAIN}"

          # ── Step 5: Proses cut dan encode ──
          process_part() {
            local start_in="$1"
            local target_out_duration="$2"
            local part_idx="$3"
            local output_file="part_${part_idx}_${{ inputs.job_id }}.${EXT}"

            echo "🔧 Memproses bagian $((part_idx+1)): start=${start_in}s → out=${target_out_duration}s"

            ffmpeg -y -ss "$start_in" -i "$STRETCHED_WAV" -t "$target_out_duration" \
              -filter:a "$FILTER_CHAIN" \
              $OUT_CODEC -ar $SAMPLE_RATE -ac 2 \
              -loglevel error \
              "$output_file" 2>> ffmpeg-error.log || return 1

            local part_dur part_size
            part_dur=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$output_file" 2>/dev/null || echo "0")
            part_size=$(stat -c%s "$output_file")

            if (( $(echo "$part_dur > $MAX_DURATION + 5" | bc -l) )); then
              echo "❌ Bagian $part_idx melebihi max_duration: ${part_dur}s > ${MAX_DURATION}s"
              return 1
            fi

            echo "✅ Bagian $((part_idx+1)): durasi=${part_dur}s, ukuran=${part_size} bytes"
            return 0
          }

          if [ "$AUTO_CUT" == "true" ] && (( $(echo "$ADJUSTED_DURATION > $MAX_DURATION" | bc -l) )); then
            PARTS=$(echo "scale=0; ($ADJUSTED_DURATION + $MAX_DURATION - 1) / $MAX_DURATION" | bc)
            PARTS=$(printf '%d' "$PARTS")
            PART_OUT_DURATION=$(echo "scale=6; $ADJUSTED_DURATION / $PARTS" | bc -l)

            echo "✂️ Auto cut: ${PARTS} bagian × ~${PART_OUT_DURATION}s output"
            echo "parts=$PARTS" >> $GITHUB_OUTPUT
            echo "part_duration=$PART_OUT_DURATION" >> $GITHUB_OUTPUT

            for (( i=0; i<PARTS; i++ )); do
              START_OUT=$(echo "scale=6; $i * $PART_OUT_DURATION" | bc -l)
              REMAINING_OUT=$(echo "scale=6; $ADJUSTED_DURATION - $START_OUT" | bc -l)
              THIS_OUT_DURATION="$PART_OUT_DURATION"
              if (( $(echo "$REMAINING_OUT < $PART_OUT_DURATION" | bc -l) )); then
                THIS_OUT_DURATION="$REMAINING_OUT"
              fi
              process_part "$START_OUT" "$THIS_OUT_DURATION" "$i" || {
                echo "❌ FFmpeg gagal di bagian $i"
                cat ffmpeg-error.log
                exit 1
              }
            done
          else
            OUTPUT_FILE="part_0_${{ inputs.job_id }}.${EXT}"
            echo "🔧 Memproses single file..."

            ffmpeg -y -i "$STRETCHED_WAV" -filter:a "$FILTER_CHAIN" \
              $OUT_CODEC -ar $SAMPLE_RATE -ac 2 \
              -loglevel error \
              "$OUTPUT_FILE" 2>> ffmpeg-error.log || {
                echo "❌ FFmpeg gagal"
                cat ffmpeg-error.log
                exit 1
              }

            REAL_DUR=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$OUTPUT_FILE" 2>/dev/null || echo "0")
            FILE_SIZE=$(stat -c%s "$OUTPUT_FILE")
            echo "✅ Single file: durasi=${REAL_DUR}s, ukuran=${FILE_SIZE} bytes"
            echo "parts=1" >> $GITHUB_OUTPUT
            echo "part_duration=$REAL_DUR" >> $GITHUB_OUTPUT
          fi

          echo "ext=$EXT" >> $GITHUB_OUTPUT
          rm -f "$MASTER_WAV" "$STRETCHED_WAV"
          cd ..

      # ===================================================================
      # UPLOAD ke Webhook
      # ===================================================================
      - name: Upload parts to webhook
        run: |
          cd temp

          case "${{ inputs.source_type }}" in
            youtube)    TITLE="${{ steps.download_youtube.outputs.title }}"   ;;
            tiktok)     TITLE="${{ steps.download_tiktok.outputs.title }}"    ;;
            soundcloud) TITLE="${{ steps.download_soundcloud.outputs.title }}";;
            mp3)        TITLE="${{ steps.download_mp3.outputs.title }}"       ;;
          esac

          PARTS="${{ steps.process.outputs.parts }}"
          EXT="${{ steps.process.outputs.ext }}"
          echo "📤 Mengirim $PARTS bagian ke: ${{ inputs.callback_url }}"

          for (( i=0; i<PARTS; i++ )); do
            OUTPUT_FILE="part_${i}_${{ inputs.job_id }}.${EXT}"

            if [ ! -f "$OUTPUT_FILE" ]; then
              echo "❌ File tidak ditemukan: $OUTPUT_FILE"
              exit 1
            fi

            PART_DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$OUTPUT_FILE" 2>/dev/null || echo "0")
            PART_SIZE=$(stat -c%s "$OUTPUT_FILE")

            echo "📤 Mengirim bagian $((i+1))/${PARTS}: $OUTPUT_FILE (${PART_DURATION}s, ${PART_SIZE} bytes)"

            HTTP_RESP=$(curl -s -o /tmp/callback_response.json -w "%{http_code}" \
              --max-time 300 \
              --connect-timeout 30 \
              -X POST "${{ inputs.callback_url }}" \
              -F "job_id=${{ inputs.job_id }}" \
              -F "audio_file=@${OUTPUT_FILE}" \
              -F "title=${TITLE}" \
              -F "source_type=${{ inputs.source_type }}" \
              -F "duration=${PART_DURATION}" \
              -F "part_index=${i}" \
              -F "total_parts=${PARTS}" \
              -F "file_size=${PART_SIZE}" \
              -F "format=${EXT}" \
              -F "settings_speed=${{ steps.process.outputs.applied_speed }}" \
              -F "settings_amplify=${{ inputs.amplify }}" \
              -F "settings_max_duration=${{ inputs.max_duration }}" \
              -F "settings_auto_cut=${{ inputs.auto_cut }}" \
              -F "settings_auto_speed=${{ inputs.auto_speed }}" \
              -F "settings_normalize_db=${{ inputs.normalize_db }}")

            echo "   HTTP $HTTP_RESP"
            
            if [[ ! "$HTTP_RESP" =~ ^2[0-9][0-9]$ ]]; then
              echo "❌ Gagal upload bagian $((i+1)) (HTTP $HTTP_RESP)"
              cat /tmp/callback_response.json || true
              exit 1
            fi
            
            echo "✅ Bagian $((i+1)) berhasil dikirim"
          done
          
          echo "✅ Semua $PARTS bagian berhasil dikirim"
          cd ..

      # ===================================================================
      # Failure Callback
      # ===================================================================
      - name: Send failure callback
        if: failure()
        run: |
          echo "❌ Workflow gagal, mengirim failure callback..."
          
          ERROR_MSG="Workflow gagal pada step: ${{ github.job }}"
          
          if [ -f temp/rubberband-error.log ]; then
            ERROR_MSG=$(cat temp/rubberband-error.log | tail -5 | tr '\n' ' ')
          elif [ -f temp/ffmpeg-error.log ]; then
            ERROR_MSG=$(cat temp/ffmpeg-error.log | tail -5 | tr '\n' ' ')
          fi
          
          curl -s -X POST "${{ inputs.callback_url }}" \
            --max-time 10 \
            --connect-timeout 5 \
            -F "job_id=${{ inputs.job_id }}" \
            -F "workflow_status=failed" \
            -F "error_message=${ERROR_MSG}" \
            -F "github_run_id=${{ github.run_id }}" \
            || true
          
          echo "📤 Failure callback terkirim"

      # ===================================================================
      # Upload error logs
      # ===================================================================
      - name: Upload error logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-logs-${{ inputs.job_id }}
          path: |
            temp/ffmpeg-error.log
            temp/rubberband-error.log
            temp/info.json
            /tmp/callback_response.json

      # ===================================================================
      # Cleanup
      # ===================================================================
      - name: Cleanup temp
        if: always()
        run: rm -rf temp/ /tmp/callback_response.json
